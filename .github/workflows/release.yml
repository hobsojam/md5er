name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - run: dotnet publish md5er.csproj --self-contained -p:PublishSingleFile=true -r win-x64 -c Release -o publish

      - name: Compute SHA-256
        run: |
          $hash = (Get-FileHash publish/md5er.exe -Algorithm SHA256).Hash.ToLower()
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Create release
        run: |
          $notes = "## Verification`n`nVerify your download against the SHA-256 checksum:`n`n``````text`n${{ env.SHA256 }}  md5er.exe`n``````"
          gh release create ${{ github.ref_name }} publish/md5er.exe `
            --title ${{ github.ref_name }} `
            --generate-notes `
            --notes-prepend "$notes"
        env:
          GH_TOKEN: ${{ github.token }}
